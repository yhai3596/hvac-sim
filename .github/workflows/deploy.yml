# 从 GitHub Actions 部署到自有服务器。
#
# 需要先在仓库 Settings → Secrets and variables → Actions 里加三个 secret：
#   DEPLOY_HOST     服务器 IP 或域名
#   DEPLOY_SSH_KEY  可登录该服务器的私钥全文（-----BEGIN ... END----- 都要）
#   DEPLOY_DOMAIN   站点域名，例如 hvac.geopro.top
# 可选：DEPLOY_USER（默认 root）、DEPLOY_PORT（默认 22）、DEPLOY_EMAIL（证书通知邮箱）
#
# 部署动作本身就是把仓库里的 deploy/install.sh 通过 stdin 喂给服务器执行——服务器上跑的
# 永远是本次 checkout 的那份脚本，不存在"服务器上的脚本是旧版"的问题。
name: deploy

on:
  workflow_dispatch:
    inputs:
      skip_tls:
        description: 只配 HTTP，不申请证书（DNS 尚未生效时选 true）
        type: boolean
        default: false
      auto_update:
        description: 在服务器上安装每 30 分钟自动拉取更新的 timer
        type: boolean
        default: true

concurrency:
  group: deploy-server        # 同时只允许一个部署在跑
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 检查必需的 secret
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
        run: |
          missing=""
          [ -n "$HOST" ]   || missing="$missing DEPLOY_HOST"
          [ -n "$KEY" ]    || missing="$missing DEPLOY_SSH_KEY"
          [ -n "$DOMAIN" ] || missing="$missing DEPLOY_DOMAIN"
          if [ -n "$missing" ]; then
            echo "::error::缺少 secret：$missing —— 在仓库 Settings → Secrets and variables → Actions 里添加"
            exit 1
          fi

      - name: 准备 SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # 往 secret 里粘私钥有三种常见事故，都只会换来一句 "error in libcrypto"：
          # 在 Windows 上复制带进了 CRLF；整段被挤成一行；只粘了 key 体、丢了 BEGIN/END 行。
          # 三种都能就地修好，先修再用；真修不好的下面会报出「形状」指明是哪一类。
          printf '%s\n' "$KEY" | tr -d '\r' | sed -e 's/[[:space:]]*$//' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          parse_key() {   # 解析得动就把公钥写出来，解析不动的报错留在 /tmp/keyerr
            ssh-keygen -y -P "" -f ~/.ssh/id_deploy > ~/.ssh/id_deploy.pub 2>/tmp/keyerr </dev/null
          }

          if ! parse_key && ! grep -q -- "-----BEGIN" ~/.ssh/id_deploy; then
            echo "私钥没有 BEGIN/END 行，按 key 体的实际类型补上信封再试"
            python3 - <<'PY'
          import base64, os, pathlib, re
          p = pathlib.Path(os.path.expanduser("~/.ssh/id_deploy"))
          body = re.sub(r"\s+", "", p.read_text())
          try:
              raw = base64.b64decode(body, validate=True)
          except Exception:
              raise SystemExit("  key 体不是合法 base64，放弃")
          # 认类型：OpenSSH 自有容器有 magic；PKCS#1/#8 是 DER SEQUENCE，先按最常见的试
          if raw.startswith(b"openssh-key-v1\0"):
              kind, width = "OPENSSH PRIVATE KEY", 70   # 与 ssh-keygen 自己的折行宽度一致
          elif raw[:1] == b"\x30":
              kind, width = "PRIVATE KEY", 64
          else:
              raise SystemExit("  认不出 key 体类型（既不是 openssh-key-v1 也不是 DER），保持原样")
          wrapped = "\n".join(body[i:i + width] for i in range(0, len(body), width))
          p.write_text(f"-----BEGIN {kind}-----\n{wrapped}\n-----END {kind}-----\n")
          print(f"  已按 {kind} 补上信封")
          PY
            chmod 600 ~/.ssh/id_deploy
          fi

          if ! parse_key; then
            echo "::error::DEPLOY_SSH_KEY 解析失败：$(tr '\n' ' ' < /tmp/keyerr)"
            echo "::error::常见原因：私钥带口令（部署密钥请用无口令的）；粘的是 PuTTY 的 .ppk（需先用 puttygen 导出 OpenSSH 格式）；粘贴时截断"
            # 只报「形状」，足以判断是哪种格式问题，又不会把 key 体印进日志：
            # 首尾行仅在是已知标识行时才原样打印，其余一律折叠成长度
            shape() {
              case "$1" in
                -----BEGIN*|-----END*|PuTTY-User-Key-File*|Encryption:*|Proc-Type:*|DEK-Info:*|ssh-*|ecdsa-*)
                  printf '%s' "$1" ;;
                *) printf '（非标识行，已隐去，长度 %s）' "${#1}" ;;
              esac
            }
            echo "  非空行数：$(grep -c . ~/.ssh/id_deploy)"
            echo "  首行：$(shape "$(head -1 ~/.ssh/id_deploy)")"
            echo "  末行：$(shape "$(grep -v '^$' ~/.ssh/id_deploy | tail -1)")"
            echo "  最省事的做法是新生成一把无口令部署密钥："
            echo "    ssh-keygen -t ed25519 -N '' -C github-actions -f deploy_key"
            echo "    # deploy_key.pub 追加到服务器 ~/.ssh/authorized_keys，deploy_key 全文（含 BEGIN/END 两行）贴进 DEPLOY_SSH_KEY"
            exit 1
          fi
          echo "私钥 OK：$(ssh-keygen -lf ~/.ssh/id_deploy.pub)"
          echo "对应公钥（服务器 ~/.ssh/authorized_keys 里必须有这一行，否则会被 Permission denied 拒掉）："
          sed 's/^/  /' ~/.ssh/id_deploy.pub
          # 首次连接采用 TOFU 记录主机指纹；对安全性有更高要求可改成把已知指纹写死在这里
          ssh-keyscan -p "${PORT:-22}" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "已记录主机指纹："
          ssh-keygen -lf ~/.ssh/known_hosts | sed 's/^/  /'

      # 把源码打包推过去，而不是让服务器自己 git clone——国内服务器往往连不上 github.com
      - name: 执行部署
        id: deploy
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
          EMAIL: ${{ secrets.DEPLOY_EMAIL }}
          SKIP_TLS: ${{ inputs.skip_tls && '1' || '0' }}
          AUTO_UPDATE: ${{ inputs.auto_update && '1' || '0' }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -o pipefail
          U="${USER_NAME:-root}"; P="${PORT:-22}"
          # 先探一次鉴权：失败时 scp 只会甩一句 Permission denied，看不出是公钥没被接受
          # 还是服务器不允许这个用户用公钥登录，这里把协商过程摘出来
          if ! ssh -i ~/.ssh/id_deploy -p "$P" -o BatchMode=yes -o ConnectTimeout=15 "$U@$HOST" true 2>/tmp/sshprobe; then
            echo "::error::SSH 鉴权失败（以 $U 登录服务器:$P）：$(tr '\n' ' ' < /tmp/sshprobe)"
            echo "  协商过程："
            ssh -vv -i ~/.ssh/id_deploy -p "$P" -o BatchMode=yes -o ConnectTimeout=15 "$U@$HOST" true 2>&1 \
              | grep -E "Offering public key|Authentications that can continue|Server accepts key|Next authentication method|Permission denied|banner" \
              | sed 's/^/    /' || true
            echo "  按这个顺序查："
            echo "   1) 公钥要加在 $U 这个用户的 ~/.ssh/authorized_keys 里（DEPLOY_USER 没设时默认用 root）"
            echo "   2) sshd_config 的 PermitRootLogin 若为 no，root 走公钥也会被拒；改成 prohibit-password 后 systemctl reload sshd"
            echo "   3) 权限：家目录不可组写，~/.ssh 为 700，authorized_keys 为 600，属主是该用户"
            echo "   4) authorized_keys 里那行必须是完整一行，粘贴时不能被折断"
            exit 1
          fi
          echo "SSH 鉴权通过（$U@服务器:$P）"
          tar czf /tmp/payload.tgz --exclude=.git --exclude=dist .
          echo "源码包 $(du -h /tmp/payload.tgz | cut -f1)，推送到 $U@$HOST:$P"
          scp -i ~/.ssh/id_deploy -P "$P" -o BatchMode=yes /tmp/payload.tgz "$U@$HOST:/tmp/hvac-payload.tgz"
          ssh -i ~/.ssh/id_deploy -p "$P" -o BatchMode=yes "$U@$HOST" bash -s <<REMOTE
          set -e
          if ! sudo -n true 2>/dev/null; then
            echo "::error::远端用户 $U 的 sudo 需要密码，非交互部署提不了权：给它配 NOPASSWD，或把 DEPLOY_USER 设成 root"
            exit 1
          fi
          rm -rf /tmp/hvac-src && mkdir -p /tmp/hvac-src
          tar xzf /tmp/hvac-payload.tgz -C /tmp/hvac-src
          rm -f /tmp/hvac-payload.tgz
          sudo env DOMAIN='$DOMAIN' EMAIL='$EMAIL' SKIP_TLS='$SKIP_TLS' AUTO_UPDATE='$AUTO_UPDATE' \
               BRANCH='$BRANCH' SRC_DIR=/tmp/hvac-src bash /tmp/hvac-src/deploy/install.sh
          REMOTE

      # 部署真的跑过才验收：否则（比如缺 secret 提前退出）会刷出一堆无意义的告警
      - name: 验收（从 runner 实际访问站点）
        if: always() && steps.deploy.outcome != 'skipped'
        env:
          DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
        run: |
          echo "--- HTTP ---"
          curl -sS -m 20 -i "http://$DOMAIN/" | head -15 || echo "HTTP 访问失败"
          echo "--- HTTPS ---"
          curl -sS -m 20 -i "https://$DOMAIN/" | head -15 || echo "HTTPS 访问失败（证书可能还没签发）"
          echo "--- 页面特征自检 ---"
          body=$(curl -sS -m 20 -L "https://$DOMAIN/" || curl -sS -m 20 -L "http://$DOMAIN/" || true)
          case "$body" in
            *"<!doctype html>"*) echo "  doctype: OK（标准模式）" ;;
            *) echo "  ::warning::没抓到 doctype，页面可能没构建成功" ;;
          esac
          case "$body" in
            *"空调控制算法"*) echo "  中文正文: OK（编码正常）" ;;
            *) echo "  ::warning::中文正文没匹配上，检查 charset" ;;
          esac
